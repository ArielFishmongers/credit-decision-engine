[project]
name = "cde"
version = "0.1.0"
description = "Credit decision engine: discrete-time hazard modelling, calibration and profit-maximising approval decisions on public loan-level data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
cde = "cde.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
