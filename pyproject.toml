[project]
name = "cde"
version = "0.1.0"
description = "Credit decision engine: discrete-time hazard modelling, calibration and profit-maximising approval decisions on public loan-level data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "joblib",          # model persistence; also a scikit-learn dependency
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
cde = "cde.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The analytical SQL is a deliverable, not a generated artefact: it is kept in .sql
# files so it reads as SQL rather than as strings inside Python.
cde = ["**/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: mypy follows the interpreter it runs under. Pinning 3.11 made
# numpy's bundled stubs unparseable ("Type statement is only supported in Python 3.12"),
# which aborted checking entirely. The runtime floor stays 3.11 in requires-python above;
# the dev environment is 3.12.
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
