# CONTROL EXPERIMENT — the calm-to-calm arm. Do not treat as the project's config.
#
# WHY THIS EXISTS. The headline stage 3 result splits 2000-2004 against 2006-2008, which
# straddles the housing crisis, so "the model under-predicts out of time" is close to
# guaranteed by the split rather than discovered in it. That makes the measured -39.7%
# NPV effect impossible to interpret on its own: it could be a regime effect specific to
# a once-in-a-generation break, or it could be ordinary out-of-time drift that the crisis
# merely amplifies. Those two readings imply completely different write-ups.
#
# So the same experiment is run again with the crisis removed from the comparison:
#
#     train 2000-2002   ->   test 2003-2004
#
# Everything else is copied from configs/default.yaml verbatim, EXCEPT the three inputs
# that are measured from the training cohorts and would otherwise leak test-period
# information into the control:
#
#     lgd                          0.1330 -> 0.1045   measured on 2000-2002
#     loss_disposition_probability 0.3697 -> 0.3384   measured on 2000-2002
#     recovery_lag_months              27 -> 26       certainty equivalent on 2000-2002
#
# HONEST LIMITATION OF THIS CONTROL, stated up front because it bounds what the
# comparison can settle. At a 120-month horizon no cohort here is crisis-free: the 2004
# vintage lives through 2004-2014 and meets the crash at ages 48-84, and even the
# training cohorts meet it at ages 72-120. Measured severity confirms it -- effective LGD
# is 0.1045 on 2000-2002 against 0.1557 on 2003-2004, already 1.49x worse. So this is not
# calm-to-calm; it is *less* crisis-exposed-to-*more*. It therefore gives a LOWER BOUND on
# how much of the headline effect is the regime break, not a clean separation.
#
# interim_dir points at data/interim_control, whose cde.duckdb is a symlink to the real
# database. Same data, separate model and report files, so the control fit cannot
# overwrite the one stage 3 quotes.

# Every economic assumption lives here, never hard-coded, and every one is
# sensitivity-tested. See PROJECT_PLAN.md section 10 for the open questions.

data:
  release: 47                    # Freddie Mac SFLD release; fixes the column layout
  source: sample                 # sample | standard
  # Out-of-time split across the GFC. Resolved, open question 3 — see PROJECT_PLAN.md
  # section 10. 2005 is omitted deliberately as the ambiguous transition year.
  train_vintages: [2000, 2001, 2002]
  test_vintages: [2003, 2004]
  raw_dir: data/raw
  interim_dir: data/interim_control

horizon:
  # Administrative censor, chosen from the data rather than from a target product.
  #
  # Measured share of all eventual loss dispositions that land inside the window:
  #     60m  52.7%      120m  92.5%
  #     84m  75.8%      180m  98.9%
  #
  # 60 months captured only half of the losses, which made the default population
  # itself incomplete and — worse — incomplete by a different amount per cohort
  # (24% for the 2003 vintage against 70% for 2008), injecting a spurious cohort
  # effect into the out-of-time comparison.
  #
  # 120 months captures 92.5% for a 32% increase in rows, and every vintage here is
  # still fully mature: 2008 + 120 months is 2018, against a March 2026 data cutoff,
  # so no censoring is introduced. An earlier version set 60 months to bracket
  # unsecured consumer-loan tenor; the project is no longer scoped to one product,
  # so the horizon follows the data.
  max_loan_age_months: 120

default_definition:
  # RESOLVED 7 September 2026 (open question 5): the probability-of-default model dates
  # the event at first passage to 90+ days past due; loss given default is estimated
  # separately from the zero-balance disposition records, where ACTUAL LOSS lives.
  #
  # They are not competing answers, they are inputs to different terms of PD x LGD x EAD.
  # 90+ DPD dates the borrower's event; the zero-balance date is the month the legal
  # process concluded, which lags it by 1-3 years in a way driven by state foreclosure
  # law and servicer capacity rather than by the borrower.
  #
  #   delinquency: first passage to current_loan_delinquency_status >= threshold  <-- PD
  #   termination: first zero-balance credit-event code                           <-- LGD
  #
  # `termination` stays switchable and stage 1 reports the hazard curve both ways: the
  # comparison is cheap and answers an obvious interview question.
  mode: delinquency

  # Release 47 credit-event codes, from the July 2026 user guide. Note 02: a third-party
  # sale is a foreclosure-auction disposition, and Freddie Mac computes ACTUAL LOSS for
  # 02, 03, 09 and 15 — their own statement that these are credit events. Earlier drafts
  # of this project listed only 03 and 09, which undercounts defaults.
  # 15 (whole loan sale) is excluded here: Actual Loss is computed for it, but it is a
  # portfolio disposition by Freddie Mac rather than a borrower credit event.
  zero_balance_default_codes: ["02", "03", "09"]

  # Exits that remove a loan from the panel for reasons correlated with its credit state.
  # Censored in v1, but the censoring is informative and the volume must be reported.
  # See PROJECT_PLAN.md section 8 limitation 7.
  #   15 = whole loan sale
  #   16 = reperforming loan securitisation (by construction, previously delinquent)
  #   96 = confirmed underwriting or major servicing defect
  zero_balance_informative_exit_codes: ["15", "16", "96"]

  # Maps to CURRENT LOAN DELINQUENCY STATUS code "03" = 90-119 days delinquent, i.e. the
  # Basel IRB 90-days-past-due definition. Not absorbing: loans cure, so `delinquency`
  # mode is a first-passage definition.
  delinquency_threshold_months: 3

person_period:
  # Some loans enter the panel with LOAN AGE already reset by a modification that
  # happened before Freddie Mac acquired them: they appear at loan age 0 while
  # reporting months of delinquency and a shortened remaining term, and the
  # MODIFICATION FLAG is blank, so the reset is invisible from that column.
  #
  # Their first passage to 90+ DPD happened before observation began, so a naive
  # build records them as "defaulted in month 0" and teaches the hazard model that
  # month 0 is near-certain default. That is left truncation with the event already
  # realised, which a first-passage model cannot use.
  #
  # Excluded by default and always counted. Set false to measure their effect —
  # the difference is worth reporting in the write-up.
  exclude_off_clock_loans: true

model:
  # Stage 2 -- the discrete-time hazard model.
  #
  # Loan age enters through a spline basis, never as a linear term: the empirical
  # hazard is strongly non-monotonic (see reports/figures/hazard_seasoning.png) and a
  # single slope through a hump is wrong everywhere. Monthly dummies were the
  # alternative and lose: with 5,434 default events spread over 61 ages, the first
  # half-dozen months hold almost none, so per-month dummies would be unstable or
  # perfectly separated.
  #
  # Six knots is chosen by BIC, not by taste. Refitting the default hazard at 6, 9,
  # 12 and 16 knots on the training vintages, BIC is minimised at 6 under both
  # candidate denominators (rows and events) -- the log-likelihood gains 63 points
  # for 38 extra parameters, which does not pay. `cde hazard --knot-study`
  # reproduces the table.
  #
  # The visible misfit in the last ten months on book is NOT a resolution problem
  # and more knots do not fix it: the 2004 cohort's late-age residuals sit at +3.3
  # standard errors while every other training cohort sits near -1, because 2004's
  # months 45-60 are calendar 2008-09 and no other training cohort was that age
  # during the crisis. That is the age-period-cohort problem inside the model, and
  # an age variable cannot absorb a calendar effect.
  loan_age_spline_knots: 6

  # Predictors whose effect on the log-odds is known to be non-linear, so they get
  # the same spline treatment. FICO is the clearest case: the gap between 620 and 660
  # is not the gap between 760 and 800.
  spline_columns: [classic_fico, original_combined_loan_to_value, original_debt_to_income_ratio]

  # Entered linearly. Loan size and rate are close enough to monotone in log-odds
  # that a slope is defensible and cheaper in degrees of freedom.
  linear_columns: [original_interest_rate, log_original_upb, original_loan_term]

  categorical_columns:
    - first_time_homebuyer_indicator
    - occupancy_status
    - channel
    - property_type
    - loan_purpose
    - number_of_borrowers
    - number_of_units
    - property_state

  # Categorical levels rarer than this share of loans are folded into OTHER. Without
  # it, small states contribute dummies fitted on almost no events.
  min_category_share: 0.005

  # sklearn's C -- inverse L2 strength, so larger means weaker penalty. Deliberately
  # weak. Regularisation shrinks predicted probabilities toward the base rate, which
  # is miscalibration introduced by the fitting procedure rather than by the model,
  # and stage 3 exists to measure miscalibration honestly.
  l2_inverse_strength: 100.0

  # NEVER set class weights or resample to balance the classes. It would improve
  # nothing that matters here and would destroy the level of the predicted
  # probabilities, which is the whole input to the NPV calculation. See claim 2.

  # Optimiser tolerance, and it is NOT a detail on rare-event data.
  #
  # sklearn's default is 1e-4, and it stops lbfgs early enough that the fitted
  # probabilities no longer sum to the observed event count: measured at +3.0% on a
  # 0.11%-event-rate simulation and +1.3% on the real training set. Because the
  # intercept is unpenalised, a converged logistic fit satisfies sum(y - p) = 0
  # exactly, at any penalty strength -- so that gap was pure optimiser artefact.
  #
  # Shipping it would have handed stage 3 a model already miscalibrated at the
  # margin and invited the conclusion that the *model* was overconfident. Claim 2
  # is about the model's level, so the level has to be the model's.
  tolerance: 1.0e-8
  max_iterations: 2000

economics:
  # How the discount rate is set. See src/cde/economics/rates.py for the full argument.
  #
  #   treasury_plus_spread : Treasury yield for the vintage + discount_spread_bps.
  #                          Borrower-independent, vintage-specific. The default.
  #   fixed                : one flat annual_discount_rate for every vintage. Retained
  #                          only so the flat assumption can be run as a sensitivity
  #                          case, never as the headline.
  #
  # Why not flat: vintage mean note rates run 5.51% (2003) to 8.13% (2000), so a single
  # 6% makes the 2000 book look wonderful and the 2003 book negative before a single
  # default is modelled. That is an artefact of the assumption and it would contaminate
  # every cross-vintage comparison the ablation depends on.
  #
  # Why not the loan's own note rate minus a spread: the note rate already contains a
  # credit-risk premium for that specific borrower, so discounting a risky borrower's
  # cash flows at a higher rate charges them for their risk twice — once in the discount
  # factor and again in the modelled hazard.
  discount_rate_mode: treasury_plus_spread
  # 10-year UST, the duration match for a 120-month horizon. This must move with
  # horizon.max_loan_age_months: discounting ten years of cash flows at a five-year
  # yield would misprice the term structure.
  benchmark_series: DGS10
  benchmark_path: data/benchmark/treasury_dgs10.csv

  # The lender's funding cost plus required return, over Treasuries. STILL AN ASSUMPTION,
  # but a bracketed one: the discount rate must land inside [Treasury, note rate],
  # because
  #     note rate = Treasury + funding + required return + expected loss + servicing + margin
  # and this spread is only the funding-and-required-return part. Expected loss is
  # modelled explicitly by the hazard model and must NOT be counted here.
  #
  # Measured primary spread (note rate - Treasury) on these vintages: 166bp to 325bp,
  # minimum 166bp for the 2006 cohort. So this value has to sit materially below 166 --
  # not below the 231bp mean. An earlier setting of 200bp put three of the eight vintages
  # OUTSIDE the bracket, giving 2000, 2006 and 2007 a discount rate above their own note
  # rate; `cde config` now reports the bracket check so that cannot pass unnoticed.
  #
  # 100bp is provisional and deliberately conservative. Sweep it; do not defend the point
  # value. Open question 1 is still open, but it is now bounded rather than free.
  discount_spread_bps: 100

  # Used only under discount_rate_mode: fixed.
  annual_discount_rate: 0.06

  # RESOLVED (open question 2) — measured, not assumed. See src/cde/economics/lgd.py.
  #
  # This is the EFFECTIVE severity per default event, and default here is first passage
  # to 90+ days past due. Two measured factors, on the TRAIN vintages only:
  #
  #     P(loss disposition | 90+ DPD)   0.3697     — 63.0% never produce a loss at all
  #     LGD | disposition               0.3596     — value-weighted, $134.3M of losses
  #     ------------------------------------------
  #     effective LGD per default       0.1330
  #
  # Re-measured at the 120-month horizon. At 60 months it read 0.1071, and the
  # difference is instructive rather than incidental: the shorter window truncated
  # TRAIN-vintage losses harder than test-vintage ones, because calm-cohort loans
  # defaulted later in life and their dispositions fell outside 60 months more often.
  # That made the train figure artificially low and inflated the headline severity
  # degradation to 2.35x, against 1.81x measured over the fairer window.
  #
  # The earlier provisional 0.30 was more than twice too high, and wrong in a dangerous
  # direction: it sits close to the *realised test-period* figure of 0.2407, so using it
  # would have flattered out-of-time performance — the model would have appeared to price
  # 2006-2008 severity correctly when it had no way to know it. Train-only is the honest
  # input; the test figure is a RESULT.
  #
  # Never pair this with a disposition-conditional LGD (~0.50): that would double-count
  # severity, since half of these loans cure. And never use the mean of per-loan ratios,
  # which is 11.55 against a median of 0.50 because costs can dwarf a small balance.
  #
  # `cde lgd` re-measures and tests/test_lgd.py fails if this value drifts from the data.
  lgd: 0.1045

  # P(loss disposition | 90+ DPD), measured on the TRAIN vintages only.
  #
  # Why this is configured as well as the product `lgd`, rather than only the product:
  # the recovery leg of the NPV identity has to be SPLIT, because its two halves arrive
  # at different times. The split is exact, not an approximation --
  #
  #   B(t) * (1 - lgd_effective)
  #     == B(t) * (1 - p_loss)                        <- cured: no disposition, no loss
  #      + B(t) * p_loss * (1 - lgd | disposition)    <- recovered cash, arriving LATE
  #
  # -- and only the second term is subject to recovery_lag_months. `lgd | disposition`
  # is then DERIVED from these two (0.1330 / 0.3697 = 0.3596) rather than configured,
  # so the three numbers cannot drift out of agreement with one another.
  #
  # An earlier plan for this lagged the whole recovery leg. That is wrong and wrong by
  # more than the error it fixes: it would discount the 63% cure portion by 27 months
  # as well, costing 11.8% of the leg against the 3.2% that is actually owed.
  #
  # `cde lgd` re-measures this and tests/test_lgd.py fails if it drifts.
  loss_disposition_probability: 0.3384

  # Months between first 90+ DPD and the disposition that produces the recovery cash.
  #
  # The section 5.4 identity books the recovery at the DEFAULT month. It does not
  # arrive then: the legal process runs for years, and the delay is driven by state
  # foreclosure law and servicer capacity. Measured on train (3,401 loans with both a
  # 90+ DPD month and a priced disposition):
  #
  #     min 0    p25 11    median 18    p75 33    p90 64    max 231    mean 27.9
  #
  # NOT the median, and not the mean either. A single constant standing in for a
  # distribution has to reproduce the right EXPECTED DISCOUNT FACTOR, since that is
  # what the NPV is linear in -- so the value wanted is the certainty equivalent
  #
  #     L*  such that  (1 + r)^-L*  ==  E[(1 + r)^-lag]
  #
  # which is 26.6-27.1 months across the plausible discount range, exposure-weighted
  # (exposure, because the recovery leg is proportional to B(t)). The median of 18
  # would understate the delay and flatter every NPV. The gap between L* and the mean
  # is small here -- 27 against 27.9 -- because at ~5% a month of delay is cheap; it
  # would matter much more at a high discount rate, so the certainty equivalent is
  # the right construction even though it barely moves the answer today.
  #
  # Nearly identical out of time: test median 19, mean 26.2. So this is one of the
  # few parameters that does NOT degrade across the crisis.
  recovery_lag_months: 26

  servicing_cost_annual_bps: 35

calibration:
  # Stage 3. The question is not "does the model rank loans correctly" but "when it
  # says 2%, does 2% of that group default" -- because the NPV consumes the
  # probability itself, not its rank. That is claim 2.

  # Bins for the reliability curve.
  bins: 20

  # quantile, NEVER uniform. The monthly default hazard has a base rate near 0.08%,
  # so twenty uniform bins over [0, 1] put essentially every row in the first bin and
  # leave nineteen empty -- a reliability "curve" of one point. Quantile bins put an
  # equal number of rows in each, which is what makes the curve readable at this base
  # rate.
  binning: quantile

  # Horizons in months on book at which cumulative incidence is checked, as opposed
  # to the monthly hazard. Both are reported: the monthly hazard is what the model
  # emits, the cumulative incidence at a horizon is what a lender actually prices
  # against, and a model can be well calibrated per month and badly calibrated
  # cumulatively because the errors compound through the survival product.
  # 60 is included now the observation window runs to 120 months.
  horizons: [12, 24, 36, 60]

  # An IN-TIME holdout, carved out of the training loans by loan identifier so a
  # loan's months are never split across the boundary.
  #
  # Why it is needed at all, given the out-of-time test set already exists: without
  # it there is nowhere honest to FIT a recalibrator. Fitting one on the test set
  # leaks the answer; fitting one on the same rows the hazard model saw measures
  # nothing, because a converged logistic fit is calibrated in-sample by
  # construction. So the recalibrator is fitted here and only ever APPLIED out of
  # time -- which is also the realistic operating position for a lender.
  holdout_share: 0.2

  # Fixed so the split is reproducible. Not a tuning knob: changing it changes which
  # loans are in the holdout, and any conclusion that moves when it changes is noise.
  holdout_seed: 20260908

  # platt   : one-parameter-per-term logistic on logit(p). Monotone, cannot overfit
  #           much, and can only rescale -- so it corrects a systematic level error
  #           and nothing else.
  # isotonic: free monotone step function. Strictly more flexible, and therefore able
  #           to fix a shape error that Platt cannot, at the cost of being able to
  #           overfit the holdout.
  # Both, compared, because which one wins is the interesting result rather than an
  # implementation detail.
  methods: [platt, isotonic]

  # Minimum calibration rows that must sit at or above an isotonic knot before its
  # fitted value may be used. Isotonic regression is unusable at its tail without this,
  # and the failure is spectacular rather than subtle.
  #
  # Measured on the in-time holdout (2,427,055 rows, 1,834 events), the fitted steps run
  # out of data long before they run out of range:
  #
  #     knot x = 0.032054  ->  y = 0.029630      136 rows at or above x
  #     knot x = 0.043344  ->  y = 0.029630        2 rows
  #     knot x = 0.043626  ->  y = 1.000000        1 row, which happened to default
  #
  # So isotonic asserted a MONTHLY default hazard of 1.0 -- certain default within the
  # month -- from a single observation, against a highest-well-estimated monthly rate of
  # 0.004985 in any bin of ~121,000 rows. 200 times too high, from n = 1.
  #
  # It is not academic. Projecting every loan across every month reaches (loan, age)
  # pairs the panel never contains, so 43 of 15.5 million projected rows landed above
  # the fit's support and were all mapped to 1.0; added to the prepayment hazard that
  # sent survival negative, and `HazardModels.survival` refused the frame outright.
  #
  # 1,000 rows because at a 0.08% base rate the expected event count below that is under
  # one, so a block's observed rate is either 0 or a spike -- noise, not a probability.
  # Set to 0 to disable the cap and reproduce the failure.
  isotonic_min_tail_rows: 1000
