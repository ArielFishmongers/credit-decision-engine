# Every economic assumption lives here, never hard-coded, and every one is
# sensitivity-tested. See PROJECT_PLAN.md section 10 for the open questions.

data:
  release: 47                    # Freddie Mac SFLD release; fixes the column layout
  source: sample                 # sample | standard
  vintages: [2000, 2001, 2002]   # provisional; the train/test split is open question 3
  raw_dir: data/raw
  interim_dir: data/interim

horizon:
  # Administrative censor. Freddie Mac loans run to 360 months; consumer loans do not.
  # See PROJECT_PLAN.md section 4.3 for the rationale.
  max_loan_age_months: 60

default_definition:
  # Open question 5 — these give materially different hazard curves.
  # termination: zero-balance codes 03 (short sale/charge-off) and 09 (REO)
  # delinquency: current loan delinquency status >= threshold
  mode: termination
  zero_balance_default_codes: ["03", "09"]
  delinquency_threshold_months: 3

competing_risks:
  # Zero balance code 01 = voluntary payoff. Treated as censoring in v1;
  # modelled as a cause-specific hazard if stage 2 lands on schedule.
  model_prepayment: false

economics:
  # PROVISIONAL. Open questions 1 and 2 — both need a defensible source before
  # any headline number is quoted.
  annual_discount_rate: 0.06
  lgd: 0.30
  servicing_cost_annual_bps: 35
